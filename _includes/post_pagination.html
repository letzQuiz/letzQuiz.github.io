{% if page.previous or page.next %}
  <nav class="quiz-pager" aria-label="More quizzes">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}" class="quiz-pager__link quiz-pager__link--prev">
        <span class="quiz-pager__label">&larr; Older</span>
        <span class="quiz-pager__title">{{ page.previous.title | markdownify | strip_html | strip }}</span>
      </a>
    {% endif %}
    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}" class="quiz-pager__link quiz-pager__link--next">
        <span class="quiz-pager__label">Newer &rarr;</span>
        <span class="quiz-pager__title">{{ page.next.title | markdownify | strip_html | strip }}</span>
      </a>
    {% endif %}
  </nav>
{% endif %}
